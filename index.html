<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Chợ Tốt · Internal Comms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f6f8;--surface:#ffffff;--ink:#101418;--ink-2:#4b5560;--muted:#8a94a0;
  --hair:#e6e9ee;--hair-strong:#d3d8df;--accent:#2a78d6;--accent-soft:#eaf2fd;
  --shadow:0 1px 2px rgba(16,20,24,.05),0 8px 24px -14px rgba(16,20,24,.20);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0e11;--surface:#16191d;--ink:#f3f5f7;--ink-2:#b7c0cb;--muted:#7f8994;
  --hair:#262b31;--hair-strong:#333a42;--accent:#3987e5;--accent-soft:#132538;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--hair);box-shadow:var(--shadow);z-index:2}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:7px}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.1}
.tabs{display:inline-flex;background:var(--bg);border:1px solid var(--hair);border-radius:11px;padding:4px;gap:3px}
.tabs button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:500;
  padding:8px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(16,20,24,.14)}
.tabs .ico{font-size:14px}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:block}
iframe[hidden]{display:none}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.03em}
@media (max-width:560px){header{padding:10px 14px}h1{font-size:15px}.tabs button{padding:7px 12px;font-size:12.5px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="eyebrow"><span class="dot"></span> Chợ Tốt · Growth</div>
    <h1>Internal Comms — Dashboards</h1>
  </div>
  <div class="tabs" role="tablist" aria-label="Dashboards">
    <button role="tab" id="tab-pulse" aria-selected="true" data-key="pulse" data-src="internal-comms-pulse/"><span class="ico">📈</span>Internal Comms Pulse</button>
    <button role="tab" id="tab-campaign" aria-selected="false" data-key="campaign" data-src="crm-onflow-campaign/"><span class="ico">🎯</span>CRM OnFlow Campaign</button>
    <button role="tab" id="tab-reward" aria-selected="false" data-key="reward" data-src="reward-crm-performance/"><span class="ico">🏆</span>Reward Performance</button>
  </div>
</header>
<main>
  <div class="loading" id="loading">Đang tải dashboard…</div>
  <iframe id="fr-pulse" title="Internal Comms Pulse" hidden></iframe>
  <iframe id="fr-campaign" title="CRM OnFlow Campaign" hidden></iframe>
  <iframe id="fr-reward" title="Reward Performance" hidden></iframe>
</main>
<script>
(function(){
  "use strict";
  var KEYS={pulse:{tab:"tab-pulse",fr:"fr-pulse",src:"internal-comms-pulse/",title:"Internal Comms Pulse"},
            campaign:{tab:"tab-campaign",fr:"fr-campaign",src:"crm-onflow-campaign/",title:"CRM OnFlow Campaign"},
            reward:{tab:"tab-reward",fr:"fr-reward",src:"reward-crm-performance/",title:"Reward Performance"}};
  var loaded={};
  // GitHub Pages gửi cache-control: max-age=600, nên sau khi deploy trình duyệt
  // có thể hiện bản cũ tới 10 phút. Gắn thêm ?v=<mốc 5 phút> để tối đa 5 phút là
  // tự lấy bản mới, nhưng trong cùng 5 phút vẫn dùng cache (file dashboard khá nặng).
  var BUST="v="+Math.floor(Date.now()/3e5);
  function pick(){
    var h=(location.hash||"").replace("#","");
    if(KEYS[h])return h;
    try{var s=localStorage.getItem("icp_tab");if(KEYS[s])return s;}catch(e){}
    return "pulse";
  }
  function activate(key){
    if(!KEYS[key])key="pulse";
    Object.keys(KEYS).forEach(function(k){
      var d=KEYS[k],tab=document.getElementById(d.tab),fr=document.getElementById(d.fr);
      var on=(k===key);
      tab.setAttribute("aria-selected",on?"true":"false");
      if(on){
        if(!loaded[k]){ // lazy-load on first activation, then keep it alive
          document.getElementById("loading").style.display="flex";
          fr.addEventListener("load",function(){document.getElementById("loading").style.display="none";},{once:true});
          fr.src=d.src+"?"+BUST;loaded[k]=true;
        }else{document.getElementById("loading").style.display="none";}
        fr.hidden=false;
      }else{fr.hidden=true;}
    });
    try{localStorage.setItem("icp_tab",key);}catch(e){}
    if(location.hash.replace("#","")!==key)history.replaceState(null,"","#"+key);
    document.title=KEYS[key].title+" · Chợ Tốt";
  }
  Object.keys(KEYS).forEach(function(k){
    document.getElementById(KEYS[k].tab).addEventListener("click",function(){activate(k);});
  });
  window.addEventListener("hashchange",function(){activate(pick());});
  activate(pick());
})();
</script>
</body>
</html>
